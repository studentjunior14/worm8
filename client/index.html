<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wormate Clone</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
  <div id="ui-layer">
    <div id="main-menu" class="menu-container">
      <div class="panel server-panel">
        <div class="panel-header"><span>🌐 SINGLE PLAYER</span></div>
        <div class="server-list-header"><span>MODE</span><span>REGION</span><span>STATUS</span></div>
        <ul class="server-list">
          <li><span class="flag">💻</span> OFFICIAL 👑 01 <span class="region">LOCAL</span></li>
        </ul>
      </div>

      <div class="panel game-panel">
        <div class="logo-area">
          <h1 class="game-title">WORMATE<span class="io">.io</span></h1>
          <p class="subtitle">Season of Love ❤️</p>
        </div>
        <div class="skin-selector-container">
          <button id="skin-prev" class="arrow-btn">❮</button>
          <div class="skin-display"><img id="skin-preview-img" src="/skins/skin_green.png" alt="Skin"></div>
          <button id="skin-next" class="arrow-btn">❯</button>
        </div>
        <div class="input-area">
          <input type="text" id="nickname-input" placeholder="Nickname..." maxlength="12">
          <button id="btn-play" class="btn btn-play">Play</button>
        </div>
        <div class="action-buttons">
          <button class="btn btn-blue">Arena</button>
          <button class="btn btn-orange">RESPAWN</button>
          <button class="btn btn-orange">Full Screen</button>
        </div>
        <div class="footer-buttons">
          <button class="btn btn-outline" id="btn-settings">Settings</button>
          <button class="btn btn-outline">Leaders</button>
          <button class="btn btn-outline" id="btn-store">Store</button>
        </div>
      </div>
    </div>

    <div id="store-overlay"
      style="display: none; position: absolute; top:0; left:0; width:100%; height:100%; z-index: 20; background: rgba(0,0,0,0.8);">
      <div id="game-wrap" style="position: relative; width: 100%; height: 100%; background: transparent;">
        <div id="game-cont" style="width: 100%; height: 100%;">
          <div id="stretch-box">
            <div id="popup-view" class="stretch-view" style="display: block;">
              <div class="stretch-container">
                <div class="popup-view-head">
                  <button id="popup-menu-back"></button>
                  <span id="popup-menu-label">Store</span>
                  <div id="popup-menu-coins-box">
                    <img class="coin-img" src="/images/coin.png" alt="Wormate coin">
                    <span id="popup-menu-coins-val">1159741</span>
                    <button class="popup-menu-coins-buy">+</button>
                  </div>
                </div>

                <div class="popup-view-list">
                  <!-- STORE MAIN VIEW -->
                  <div id="store-view" class="base-popup-view" style="display: block;">
                    <div id="store-go-wear-button">
                      <img class="store-go-image" src="/images/store-wear-button.jpg" alt="Wear store">
                      <span class="store-go-text">Clothing</span>
                    </div>

                    <div id="store-go-skins-button">
                      <img class="store-go-image" src="/images/store-skins-button.jpg" alt="Skins store">
                      <span class="store-go-text">Skins</span>
                    </div>

                    <div id="store-go-coins-button">
                      <img class="store-go-image" src="/images/store-coins-button.jpg" alt="Coins store">
                      <span class="store-go-text">Coins</span>
                    </div>
                  </div>

                  <!-- SKINS VIEW (Hidden by default) -->
                  <div id="skins-view" class="base-popup-view" style="display: none;">
                    <div class="store-left">
                      <div class="store-view-cont">
                        <div id="skin-group-description-cont"><span id="skin-group-description-text"></span></div>
                        <div id="skin-description-cont"><span id="skin-description-text"></span></div>

                        <canvas id="store-view-canv" width="600" height="200"
                          style="touch-action: none; cursor: inherit;"></canvas>
                        <div id="store-view-prev"><svg>
                            <path d="M28.37 2L48 20.24 28 38V22.28"
                              style="fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:4px;">
                            </path>
                            <circle cx="14.73" cy="19.95" style="fill:none;stroke-width:2px;" r="4.8"></circle>
                            <circle cx="3.45" cy="20.42" r="2.4" style="fill:none;stroke-width:1px;"></circle>
                          </svg></div>
                        <div id="store-view-next"><svg>
                            <path d="M28.37 2L48 20.24 28 38V22.28"
                              style="fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:4px;">
                            </path>
                            <circle cx="14.73" cy="19.95" style="fill:none;stroke-width:2px;" r="4.8"></circle>
                            <circle cx="3.45" cy="20.42" r="2.4" style="fill:none;stroke-width:1px;"></circle>
                          </svg></div>
                        <div id="idReplaceSkin" style="text-align: center; margin-top: 10px; color: #aaa;">ID: <span
                            id="skin-id-display">0</span></div>
                      </div>

                      <div id="store-buy-button" style="display: none;">
                        <span>Buy for</span>
                        <img class="coin-img" src="/images/coin.png" alt="Wormate Coin">
                        <span id="store-item-price">5600123</span>
                      </div>

                      <div id="store-locked-bar" style="display: none;"><span id="store-locked-bar-text"></span></div>
                    </div>

                    <div class="store-right">
                      <ul id="store-groups">
                        <!-- Categories populated by JS -->
                      </ul>
                    </div>
                  </div>

                  <!-- PLACEHOLDERS for other views -->
                  <div id="wear-view" class="base-popup-view" style="display: none;">
                    <ul class="wear-types">
                      <li id="wear-eyes-button" data-category="eyes"></li>
                      <li id="wear-mouths-button" data-category="mouths"></li>
                      <li id="wear-glasses-button" data-category="glasses"></li>
                      <li id="wear-hats-button" data-category="hats"></li>
                    </ul>

                    <div class="wear-view-cont">
                      <canvas id="wear-view-canv" width="700" height="360"
                        style="touch-action: none; cursor: inherit;"></canvas>
                      <div id="wear-view-prev"><svg>
                          <path d="M28.37 2L48 20.24 28 38V22.28"
                            style="fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:4px;">
                          </path>
                          <circle cx="14.73" cy="19.95" style="fill:none;stroke-width:2px;" r="4.8">
                          </circle>
                          <circle cx="3.45" cy="20.42" r="2.4" style="fill:none;stroke-width:1px;">
                          </circle>
                        </svg></div>
                      <div id="wear-view-next"><svg>
                          <path d="M28.37 2L48 20.24 28 38V22.28"
                            style="fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:4px;">
                          </path>
                          <circle cx="14.73" cy="19.95" style="fill:none;stroke-width:2px;" r="4.8">
                          </circle>
                          <circle cx="3.45" cy="20.42" r="2.4" style="fill:none;stroke-width:1px;">
                          </circle>
                        </svg></div>
                      <div id="idReplaceWear"
                        style="text-align: center; color: #aaa; position: absolute; bottom: 10px; width: 100%;">ID:
                        <span id="wear-id-display">0</span></div>
                    </div>

                    <div id="wear-description-cont"><span id="wear-description-text"></span></div>

                    <button id="btn-wear-equip"
                      style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: #4CAF50; color: white; border: none; padding: 10px 30px; border-radius: 5px; cursor: pointer; font-size: 16px;">Equip</button>
                  </div>
                  <div id="coins-view" class="base-popup-view" style="display: none;"></div>

                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="game-over-modal" style="display: none;">
      <div class="panel game-over-panel">
        <h2 style="color: #ff4444; font-size: 36px; margin-bottom: 10px;">GAME OVER</h2>
        <p style="color: #ccc;">Final Score</p>
        <h1 id="final-score" style="color: #ffd700; font-size: 48px; margin: 10px 0;">0</h1>

        <div class="stats-row">
          <div><span style="color:orange">HS:</span> <span id="final-hs">0</span></div>
          <div><span style="color:cyan">Kills:</span> <span id="final-kills">0</span></div>
        </div>

        <br>
        <button id="btn-go-home" class="btn btn-blue">Go Home</button>
        <button id="btn-restart" class="btn btn-play">Play Again</button>
      </div>
    </div>

  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
